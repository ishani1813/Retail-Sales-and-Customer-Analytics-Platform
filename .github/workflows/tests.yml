name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas numpy scikit-learn pytest ruff

      - name: Lint (ruff)
        run: ruff check analysis/ tests/ app/

      - name: Build processed data from the synthetic sample (CI doesn't have the real dataset)
        run: python scripts/build_processed_from_sample.py

      - name: Run data quality tests
        run: pytest tests/ -v
